<div class="auth-card">
  <div class="header">
    <div class="logo-box">
      <img src="/brand/logo-mark.svg" alt="Hey Payments Logo" width="48" height="48" />
    </div>
    <h1 class="title">Verify Phone Number</h1>
    <p class="subtitle">Enter the 6-digit verification code sent to {{ phone() }}</p>
  </div>

  @if (formError() || auth.error()) {
    <div class="error-banner" role="alert">
      {{ formError() || auth.error() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="form-body">
    <div class="field">
      <label for="otp" class="label">One-Time Password</label>
      <input
        id="otp"
        name="otp"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        [ngModel]="otp()"
        (ngModelChange)="otp.set($event)"
        placeholder="000000"
        class="input otp-input"
        required
        autocomplete="one-time-code"
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="auth.loading()">
      @if (auth.loading()) {
        Verifying...
      } @else {
        Verify & Continue
      }
    </button>

    <div class="footer-links">
      <a routerLink="/auth/login" class="link">Back to Sign In</a>
    </div>
  </form>
</div>
