<header class="app-shell-header">
  <div
    class="connectivity-banner"
    role="status"
    aria-live="polite"
    [class.is-online]="connectivity.status() === 'online'"
    [class.is-offline]="connectivity.status() === 'offline'"
    [class.is-degraded]="connectivity.status() === 'degraded'"
  >
    @if (connectivity.status() === 'online') {
      <svg lucideCircleCheck class="status-icon" [size]="18" aria-hidden="true"></svg>
      <span class="status-text">Online · synced</span>
    } @else if (connectivity.status() === 'offline') {
      <svg lucideWifiOff class="status-icon" [size]="18" aria-hidden="true"></svg>
      <span class="status-text">Offline · payments still work</span>
    } @else {
      <svg lucideRefreshCw class="status-icon" [size]="18" aria-hidden="true"></svg>
      <span class="status-text">Degraded · sync delayed</span>
    }
  </div>
</header>

<main class="container">
  <div class="header">
    <div class="logo-container">
      <img
        src="brand/logo-wordmark-light.svg"
        alt="Hey Payments"
        class="app-logo app-logo--light"
      />
      <img src="brand/logo-wordmark-dark.svg" alt="Hey Payments" class="app-logo app-logo--dark" />
    </div>
    <p class="subtitle">Offline-First Payment Gateway Architecture</p>
  </div>

  <router-outlet></router-outlet>
</main>
